name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install Lua development tools
        run: |
          eval "$(luarocks path --lua-version=5.1 --bin)"
          make deps

      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check readeck.koplugin/main.lua readeck.koplugin/_meta.lua readeck.koplugin/readeck spec

      - name: Lint and test
        run: |
          eval "$(luarocks path --lua-version=5.1 --bin)"
          make lint
          make test

      - name: Read plugin version and verify it matches the tag
        id: version
        run: |
          version="$(sed -n 's/^    version = "\(.*\)",$/\1/p' readeck.koplugin/_meta.lua)"
          if [ -z "$version" ]; then
            echo "Could not read version from readeck.koplugin/_meta.lua" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$tag_version" ]; then
              echo "Tag $GITHUB_REF_NAME does not match _meta.lua version $version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package plugin zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip
          zip_file="readeck.koplugin-v${{ steps.version.outputs.version }}.zip"
          zip -r -X "$zip_file" readeck.koplugin
          unzip -l "$zip_file"

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v ver="v$version" '
            $0 ~ "^## " ver "([[:space:]]|$)" { found = 1; next }
            /^## v/ && found { exit }
            found { print }
          ' CHANGELOG.md > section.md
          if [ ! -s section.md ]; then
            echo "No CHANGELOG.md section found for v$version" >&2
            exit 1
          fi
          { echo "# Changelog"; echo; cat section.md; } > release_notes.md

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${{ steps.version.outputs.version }}"
          zip_file="readeck.koplugin-v${version}.zip"
          gh release create "$tag" "$zip_file" \
            --title "Readeck KOReader Plugin v${version}" \
            --notes-file release_notes.md

      - name: Upload package as workflow artifact
        if: startsWith(github.ref, 'refs/tags/') != true
        uses: actions/upload-artifact@v4
        with:
          name: readeck.koplugin-v${{ steps.version.outputs.version }}
          path: readeck.koplugin-v${{ steps.version.outputs.version }}.zip
